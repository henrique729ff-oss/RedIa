1<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedAI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#05070b;
    color:#fff;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:64px;
    background:#080c13;
    border-bottom:1px solid #16304d;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:bold;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:linear-gradient(135deg,#087cff,#00c8ff);
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 20px #087cff55;
}

.status{
    margin-left:15px;
    color:#43c5ff;
    font-size:12px;
}

.main{
    flex:1;
    display:flex;
    overflow:hidden;
}

.sidebar{
    width:240px;
    background:#070a10;
    border-right:1px solid #142238;
    padding:15px;
}

.new{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #087cff;
    background:#0b1726;
    color:white;
    cursor:pointer;
}

.menu{
    margin-top:20px;
}

.menu div{
    padding:12px;
    margin:4px 0;
    border-radius:9px;
    color:#9eafc3;
    cursor:pointer;
}

.menu div:hover{
    background:#0d1928;
    color:white;
}

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

.welcome{
    max-width:700px;
    margin:70px auto;
    text-align:center;
}

.big-icon{
    width:78px;
    height:78px;
    margin:auto auto 20px;
    border-radius:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(135deg,#087cff,#00c8ff);
    box-shadow:0 0 35px #087cff44;
}

.welcome h1{
    font-size:30px;
    margin-bottom:10px;
}

.welcome p{
    color:#8190a5;
    line-height:1.5;
}

.message{
    max-width:850px;
    margin:0 auto 18px;
    display:flex;
    gap:10px;
}

.avatar{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#102033;
    color:#49bdff;
}

.user .avatar{
    background:#087cff;
    color:white;
}

.bubble{
    max-width:calc(100% - 45px);
    background:#0a121d;
    border:1px solid #17304c;
    border-radius:13px;
    padding:13px 15px;
    line-height:1.5;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.user{
    flex-direction:row-reverse;
}

.user .bubble{
    background:#075dcc;
    border-color:#087cff;
}

.code{
    margin-top:10px;
    background:#030507;
    border:1px solid #193a5d;
    border-radius:9px;
    overflow:hidden;
}

.code-top{
    height:38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    background:#080d15;
    color:#7890aa;
    font-size:12px;
}

.copy{
    border:0;
    border-radius:6px;
    padding:6px 10px;
    background:#087cff;
    color:white;
    cursor:pointer;
}

.code pre{
    padding:14px;
    overflow:auto;
    color:#d7e8ff;
    font-family:Consolas,monospace;
    font-size:13px;
}

.bottom{
    padding:10px 15px 16px;
}

.input{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:8px;
    align-items:flex-end;
    background:#0a1018;
    border:1px solid #19324e;
    border-radius:15px;
    padding:8px;
}

textarea{
    flex:1;
    min-height:42px;
    max-height:130px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:11px;
    font-size:14px;
}

.send{
    width:44px;
    height:44px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#087cff,#00aaff);
    color:white;
    font-size:18px;
    cursor:pointer;
}

.info{
    text-align:center;
    color:#506075;
    font-size:10px;
    margin-top:7px;
}

@media(max-width:700px){
    .sidebar{
        display:none;
    }

    .status{
        display:none;
    }

    .messages{
        padding:15px 10px;
    }

    .welcome{
        margin:50px auto;
    }

    .welcome h1{
        font-size:25px;
    }

    .bubble{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="logo">
    <div class="logo-icon">✦</div>
    RedAI
</div>

<div class="status">
    ● Online
</div>

</header>

<div class="main">

<aside class="sidebar">

<button class="new" onclick="novaConversa()">
＋ Nova conversa
</button>

<div class="menu">

<div onclick="novaConversa()">💬 Nova conversa</div>

<div onclick="exemploLua()">💻 Criar Lua</div>

<div onclick="exemploHTML()">🌐 Criar HTML</div>

<div onclick="sobre()">🤖 Sobre a RedAI</div>

</div>

</aside>

<section class="chat">

<div class="messages" id="messages">

<div class="welcome" id="welcome">

<div class="big-icon">✦</div>

<h1>Olá! Eu sou a RedAI</h1>

<p>
Digite uma mensagem abaixo.
Posso conversar e mostrar exemplos de código.
</p>

</div>

</div>

<div class="bottom">

<div class="input">

<textarea
id="input"
placeholder="Digite sua mensagem..."
></textarea>

<button class="send" onclick="enviar()">
➤
</button>

</div>

<div class="info">
RedAI • Assistente de programação
</div>

</div>

</section>

</div>

</div>

<script>

const input = document.getElementById("input");
const messages = document.getElementById("messages");

input.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

enviar();

}

});

function limparInicio(){

const welcome=document.getElementById("welcome");

if(welcome){
welcome.remove();
}

}

function enviar(){

const texto=input.value.trim();

if(!texto)return;

limparInicio();

adicionarUsuario(texto);

input.value="";

setTimeout(function(){

responder(texto);

},500);

}

function adicionarUsuario(texto){

const div=document.createElement("div");

div.className="message user";

div.innerHTML=`

<div class="avatar">👤</div>

<div class="bubble">
${escapar(texto)}
</div>

`;

messages.appendChild(div);

rolar();

}

function adicionarIA(texto){

const div=document.createElement("div");

div.className="message";

div.innerHTML=`

<div class="avatar">✦</div>

<div class="bubble">
${escapar(texto)}
</div>

`;

messages.appendChild(div);

rolar();

}

function adicionarCodigo(tipo,codigo){

const div=document.createElement("div");

div.className="message";

div.innerHTML=`

<div class="avatar">✦</div>

<div class="bubble">

Aqui está o exemplo:

<div class="code">

<div class="code-top">

<span>${tipo}</span>

<button class="copy"
onclick="copiar(this)">
Copiar
</button>

</div>

<pre>${escapar(codigo)}</pre>

</div>

</div>

`;

messages.appendChild(div);

rolar();

}

function responder(texto){

const t=texto.toLowerCase();

if(t.includes("lua") || t.includes("roblox")){

const codigo=`-- Exemplo de Lua

local mensagem = "Olá!"

print(mensagem)

local jogador = game.Players.LocalPlayer

if jogador then
    print("Jogador:", jogador.Name)
end`;

adicionarCodigo("Lua",codigo);

return;

}

if(t.includes("html") || t.includes("site")){

const codigo=`<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Meu Site</title>
</head>

<body>

<h1>Olá!</h1>

<p>Meu site está funcionando.</p>

</body>

</html>`;

adicionarCodigo("HTML",codigo);

return;

}

if(
t.includes("oi") ||
t.includes("olá") ||
t.includes("ola")
){

adicionarIA(
"Olá! 👋 Eu sou a RedAI. Como posso ajudar você?"
);

return;

}

if(t.includes("quem é você")){

adicionarIA(
"Eu sou a RedAI, uma interface de assistente de programação."
);

return;

}

adicionarIA(
"Entendi sua mensagem. 👍\n\n" +
"Neste momento estou funcionando como uma versão local. " +
"No próximo passo vamos conectar esta interface a uma API de IA " +
"para eu poder responder livremente e gerar códigos de verdade."
);

}

function copiar(botao){

const codigo=
botao.parentElement
.nextElementSibling
.innerText;

navigator.clipboard.writeText(codigo);

botao.innerText="Copiado!";

setTimeout(function(){

botao.innerText="Copiar";

},1500);

}

function exemploLua(){

input.value="Crie um exemplo de script Lua para Roblox";

input.focus();

}

function exemploHTML(){

input.value="Crie uma página HTML";

input.focus();

}

function sobre(){

limparInicio();

adicionarIA(
"A RedAI é seu assistente de programação. " +
"Agora vamos conectar ela a uma IA real."
);

}

function novaConversa(){

messages.innerHTML=`

<div class="welcome" id="welcome">

<div class="big-icon">✦</div>

<h1>Nova conversa</h1>

<p>
O que vamos criar hoje?
</p>

</div>

`;

input.value="";

}

function rolar(){

messages.scrollTop=messages.scrollHeight;

}

function escapar(texto){

return texto
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
  </html>
